<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="用于测试 Google Tag Manager 点击事件的简单页面。" />
    <title>GTM 点击测试</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="test-card">
      <p class="eyebrow">Google Tag Manager</p>
      <h1>点击事件测试</h1>

      <button id="gtm-test-button" type="button">测试点击</button>
      <p id="test-status" class="status" aria-live="polite">等待点击</p>

    <script src="script.js"></script>
